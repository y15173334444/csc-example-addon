org.gradle.jvmargs = -Xmx2G
org.gradle.daemon = true

# ── Minecraft / NeoForge（与主仓对齐）/ aligned with the main repo ──
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1]
neo_version = 21.1.233
neo_version_range = [21.1.233,)
loader_version_range = [4,)

# ── 模组标识 / Mod identity ──────────────────────────────────────────
mod_id = cscexample
mod_name = CSC Example Addon
mod_license = MIT
mod_version = 1.0.0
mod_authors = StarryNight_Luo
mod_description = Third-party example addon for Create: Schematic Compute's public API: registers two custom nodes (a provider-direct signal read and a resumable heavy node) and enrols them into the blueprint host's roster.

# ── 依赖版本 ─────────────────────────────────────────────────────────
# 对主仓产出的 CSC jar 编译：先在主仓 ./gradlew jar
# Compiles against the CSC jar the main repo produces: run ./gradlew jar there first.
csc_version = 1.3.0
# 兼容性按 API 自己的版本号判别（api 包 `ApiVersion.CURRENT`，与模组版本解耦）：本示例
# 只使用 API 0.1.0 面（自定义节点注册 + 准入），init 期经 `ApiVersion.isAtLeast(0,1,0)`
# 守门；模组版本区间只表达最低发行线 `[1.3.0,)`，不拿它推断 API 兼容性。
# Compatibility is indexed by the API's own version (api.ApiVersion.CURRENT, decoupled
# from the mod version): this example uses the API 0.1.0 surface (custom-node registration
# plus admission) and gates on ApiVersion.isAtLeast(0, 1, 0) in init; the mod range only
# states the minimum release line ([1.3.0,)) and never implies API compatibility.
csc_version_range = [1.3.0,)
