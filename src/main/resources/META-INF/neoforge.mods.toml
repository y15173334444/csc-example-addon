modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
Create: Schematic Compute 公开 API 的第三方示例模组：注册两个自定义节点
（提供方直连信号读取 + 可恢复重节点）并登记进蓝图机准入名单。
'''

    [[mods.dependencies]]
    modId = "minecraft"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "neoforge"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "create_schematic_compute"
    # 兼容性按 API 自己的版本号判别（api 包 ApiVersion.CURRENT，与模组版本解耦）：本示例
    # 只使用 API 0.1.0 面并在 init 期守门；模组区间只表达最低发行线，不推断 API 兼容性。
    # Compatibility is indexed by the API's own version (api.ApiVersion.CURRENT, decoupled
    # from the mod version): this example uses the API 0.1.0 surface and gates in init; the
    # mod range only states the minimum release line, never API compatibility.
    versionRange = "${csc_version_range}"
    ordering = "AFTER"
    side = "BOTH"
    mandatory = true
