modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
Create: Schematic Compute 公开 API 的第三方示例模组：注册两个自定义节点
（提供方直连信号读取 + 可恢复重节点）并登记进蓝图机准入名单。
'''

    [[mods.dependencies]]
    modId = "minecraft"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "neoforge"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"
    mandatory = true

    [[mods.dependencies]]
    modId = "create_schematic_compute"
    # API 实验期至 1.4.0 冻结（签名与语义可变），上限卡在 1.4——与主仓对 Sable 依赖的写法同理。
    # The API is experimental until the 1.4.0 freeze (signatures and semantics may change),
    # so the range stops below 1.4 - the same reasoning as the main repo's Sable range.
    versionRange = "${csc_version_range}"
    ordering = "AFTER"
    side = "BOTH"
    mandatory = true
